[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Os
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    m5stack/M5Cardputer
